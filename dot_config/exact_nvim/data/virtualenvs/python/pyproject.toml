[project]
name            = "nvim"
version         = "0.1.0"
description     = "Neovim Python provider environment"
requires-python = ">=3.12,<3.13"
authors         = [{ name = "William Blackie", email = "will@developerfy.com" }]
dependencies    = [
  "autoflake>=2.3.1",
  "black>=25.12.0",
  "isort>=7.0.0",
  "pip>=26.0",
  "pydev>=0.0.1",
  "pynvim>=0.5.2",
  "pytest>=9.0.2",
  "pytest-cov>=7.1.0",
]

[build-system]
requires      = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = false
